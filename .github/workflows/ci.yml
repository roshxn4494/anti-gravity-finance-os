name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Focused static checks
        run: >
          ruff check --select F,E4,E7,E9
          finance/config.py
          finance/domain
          finance/hardening.py
          finance/metrics.py
          finance/security.py
          finance/agent/master_graph.py
          finance/agent/master_tools.py
          tests/test_hardening.py
      - name: Tests
        run: pytest -q
